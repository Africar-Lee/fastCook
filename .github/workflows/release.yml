name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate app version and release tag
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { expo } = JSON.parse(readFileSync('app/app.json', 'utf8'));
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (typeof expo.version !== 'string' || !versionPattern.test(expo.version)) {
            throw new Error('Set expo.version to a version such as 0.1.0 in app/app.json.');
          }
          const versionCode = expo.android?.versionCode;
          if (!Number.isInteger(versionCode) || versionCode < 1 || versionCode > 2100000000) {
            throw new Error('Set a positive Android versionCode no greater than 2100000000.');
          }
          const packageName = expo.android?.package;
          if (typeof packageName !== 'string' || !/^[a-zA-Z]\w*(\.[a-zA-Z]\w*)+$/.test(packageName)) {
            throw new Error('Set a valid Android package name in app/app.json.');
          }
          if (process.env.GITHUB_EVENT_NAME === 'push'
              && process.env.GITHUB_REF_NAME !== `v${expo.version}`) {
            throw new Error('The release tag must equal v followed by expo.version.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${expo.version}\nversion-code=${versionCode}\npackage=${packageName}\n`);
          NODE
      - name: Require release commit on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::Release tags must point to a commit on main.'
            exit 1
          fi

  checks:
    needs: prepare
    uses: ./.github/workflows/validate.yml
    with:
      release: ${{ github.event_name == 'push' }}

  build:
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Configure the $secret_name repository secret before building an APK."
              exit 1
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.0'
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run app:prepare
      - name: Generate Android project
        working-directory: app
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APP_VERSION_CODE: ${{ needs.prepare.outputs.version-code }}
          APP_PACKAGE: ${{ needs.prepare.outputs.package }}
        run: bash .github/scripts/sign-apk.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastcook-android-${{ needs.prepare.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastcook-android-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk \
            --verify-tag --draft --title "FastCook $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
