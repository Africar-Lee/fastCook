name: CI checks

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run app:prepare -- --skip-validation
      - run: npm run typecheck
      - run: npm run app:typecheck
      - name: Test app functionality
        run: node --test tools/app/*.test.mjs packages/engine/test/meal.test.mjs app/src/storage/*.test.mjs app/src/model/*.test.mjs
      - run: npm --workspace app run export
